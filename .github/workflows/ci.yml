name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Nightly, so drift against the framework and Rails surfaces without a push.
  schedule:
    - cron: "0 7 * * *"

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      CI: true
      RAILS_ENV: test
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Unit suite (no Rails)
        run: bundle exec rake test

      - name: Integration suite (dummy Rails app)
        run: bundle exec rake test:integration
